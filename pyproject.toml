[tool.poetry]
name = "expense-extract"
version = "1.0.0"
description = "Pulls a Profit & Loss report out of QuickBooks Desktop through the QBFC SDK and writes a formatted, expense-only Excel report."
authors = ["Weston-Matthews <weston.j.matthews@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.8"
easygui = "^0.98.1"
pywin32 = "^227"
openpyxl = "~3.0.3"
pyinstaller = "^3.6"
pywin32-ctypes = "^0.2.0"
pefile = "^2019.4.18"

[tool.poetry.group.dev.dependencies]
pytest = ">=6.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
